# no-mistakes gate config. With allow_repo_commands off, the commands, agent and
# pr.base_branch are read only from the default branch's (develop) copy, not from
# the pushed branch. This ensures each agent's branch cannot change what the gate
# runs or retarget its PR at main.
allow_repo_commands: false

commands:
  # The run worktree has tracked files only; copy the local, gitignored env file in.
  prepare: 'for f in .env .env.local .env.develop.local; do [ -f "$HOME/Documents/GitHub/kioku/$f" ] && cp "$HOME/Documents/GitHub/kioku/$f" .; done; true && npm ci --prefer-offline'
  lint: "npm run typecheck"
  test: "npm run test:unit"

pr:
  base_branch: develop

test:
  instructions: |
    Run `npm run dev` and open the Nuxt app in a browser; drive the changed flow the
    way a user would. The Python worker runs separately:
    `cd worker && uv run --env-file .env python .`. See CLAUDE.md and START-HERE.md.
  evidence:
    attach_media: true
