# The worker's own manifest. `03` §10: the two ecosystems do not share one, and
# pretending otherwise is how a two-toolchain repo starts lying about what is
# installed.
#
# ⚠️ Arrived with #3 rather than #7, because #3's Python half needs a test
# runner and `11` §1 already named it. Renovate's `pep621` manager reads this
# file — including `[dependency-groups]` (PEP 735) — and maintains `uv.lock`,
# with no change to `renovate.json`: its default file pattern is
# `/(^|/)pyproject\.toml$/`, so `worker/` is matched where it sits. Verified
# 2026-09-10 against Renovate's own manager documentation, which is `03` §13.5's
# "a bot arrives with the first manifest" satisfied rather than deferred.
#
# ⚠️ This project is deliberately **not a package**. `03` §10 puts the pipeline
# in `worker/pipeline/`, one flat module per stage named by the declaration, and
# a `src/` layout would put a directory between that list and the declaration it
# is supposed to mirror.

[project]
name = "kioku-worker"
version = "0.0.0"
description = "The Python ingestion tier — ADR 0015, ADR 0019."
requires-python = ">=3.11"
# ⚠️ **`psycopg[binary]` >= 3.2.4 is a floor with a reason, not a version.**
# Before 3.2.4 a notification arriving between `LISTEN` and the start of the
# `notifies()` generator was silently lost (ADR 0027, verification §9.1) — which
# is exactly `03` §3.1 steps 2 through 4. `renovate.json` carries the same floor
# as PIN 1/6, so a cleanup that sees only a number cannot relax it.
#
# `[binary]` bundles libpq 17.2, which sets `sslsni=1` by default — the chain
# ADR 0027 rests on for Neon's direct endpoint (verification §9.1).
dependencies = [
    "psycopg[binary]>=3.2.4",
    "sudachidict-core==20260723",
    "sudachipy==0.6.11",
]

[dependency-groups]
# `11` §1 names both: pytest 9.1.1 and testcontainers 4.15.0. ⚠️ The container is
# needed by **forty** of the tests here and by nothing in the TypeScript suite —
# ADR 0038 said three, then twenty-three, and carries a dated amendment for each
# move. `worker/tests/README.md` has the table.
#
# ⚠️ **This line has now been stale twice**, both times because the count lives
# in four files and a ticket amended two of them. If it is wrong again, the fix
# is not a better search — it is to stop writing the number here and point at
# `worker/tests/README.md`, which is the one place that has to be right.
dev = ["pytest==9.1.1", "testcontainers[postgres]==4.15.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
